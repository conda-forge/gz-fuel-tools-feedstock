schema_version: 1

context:
  component_name: fuel-tools
  cmake_name: fuel_tools
  repo_name: ${{ "gz-" + component_name }}
  version: 11.0.0
  major_version: "11"
  name: ${{ repo_name }}
  component_version: ${{ component_name + major_version }}
  cmake_version: ${{ cmake_name }}
  cxx_name: ${{ "lib" + name }}

recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/gazebosim/${{ repo_name }}/archive/${{ repo_name }}${{ major_version }}_${{ version }}.tar.gz
    sha256: 508ee5f0c8e9ab43effa6ce307736f146914bb22580cd154d7e09b67e4838c54

build:
  number: 0

outputs:
  - package:
      name: ${{ cxx_name }}
    build:
      script:
        - if: unix
          then: build_cxx.sh
        - if: win
          then: bld_cxx.bat
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
        - pkgconfig
      host:
        - libgz-cmake
        - libgz-math
        - libgz-msgs
        - libgz-common
        - libgz-tools
        - libcurl
        - jsoncpp
        - libzip
        - yaml
        - tinyxml2
        - libprotobuf
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
    tests:
      - script:
          - if: not win
            then:
              - test -f ${PREFIX}/include/gz/${{ cmake_version }}/gz/${{ cmake_name }}.hh
              - test -f ${PREFIX}/lib/cmake/gz-${{ cmake_name }}/gz-${{ cmake_name }}-config.cmake
          - if: linux
            then:
              - test -f ${PREFIX}/lib/libgz-${{ cmake_name }}.so
          - if: osx
            then:
              - test -f ${PREFIX}/lib/libgz-${{ cmake_name }}.dylib
          - if: win
            then:
              - if not exist %PREFIX%\\Library\\include\\gz\\${{ cmake_version }}\\gz\\${{ cmake_name }}.hh exit 1
              - if not exist %PREFIX%\\Library\\lib\\gz-${{ cmake_name }}.lib exit 1
              - if not exist %PREFIX%\\Library\\bin\\gz-${{ cmake_name }}.dll exit 1
              - if not exist %PREFIX%\\Library\\lib\\cmake\\gz-${{ cmake_name }}\\gz-${{ cmake_name }}-config.cmake exit 1

  - package:
      name: ${{ name }}
    requirements:
      run:
        - ${{ pin_subpackage(cxx_name, exact=True) }}
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
    tests:
      - script:
          - if: not win
            then:
              - test -f ${PREFIX}/include/gz/${{ cmake_version }}/gz/${{ cmake_name }}.hh
              - test -f ${PREFIX}/lib/cmake/gz-${{ cmake_version }}/gz-${{ cmake_name }}-config.cmake
          - if: linux
            then:
              - test -f ${PREFIX}/lib/libgz-${{ cmake_name }}.so
          - if: osx
            then:
              - test -f ${PREFIX}/lib/libgz-${{ cmake_name }}.dylib
          - if: win
            then:
              - if not exist %PREFIX%\\Library\\include\\gz\\${{ cmake_version }}\\gz\\${{ cmake_name }}.hh exit 1
              - if not exist %PREFIX%\\Library\\lib\\gz-${{ cmake_name }}.lib exit 1
              - if not exist %PREFIX%\\Library\\bin\\gz-${{ cmake_name }}.dll exit 1
              - if not exist %PREFIX%\\Library\\lib\\cmake\\gz-${{ cmake_name }}\\gz-${{ cmake_name }}-config.cmake exit 1

about:
  homepage: https://github.com/gazebosim/${{ repo_name }}
  license: Apache-2.0
  license_file: LICENSE
  summary: A client library and command line tools for interacting with Gazebo Fuel servers.

extra:
  feedstock-name: ${{ repo_name }}
  recipe-maintainers:
    - traversaro
    - Tobias-Fischer
